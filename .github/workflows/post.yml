name: Post to X

on:
  schedule:
    # Mon / Wed / Fri at 14:00 UTC (~9-10am US Eastern), i.e. every 2-3 days.
    - cron: "0 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate only, do not publish"
        type: boolean
        default: true
      no_image:
        description: "Publish without an image"
        type: boolean
        default: false

# Needed so the job can push log.json back when GH_PAT is not set.
permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A PAT makes the log commit count as user activity, which keeps
          # GitHub from disabling this schedule after 60 idle days.
          # Falls back to the built-in token if GH_PAT is not configured.
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable. Leave unset to use the script default
          # and let it fall back automatically when a model is retired.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/post.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_image && '--no-image' || '' }}

      - name: Commit log
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- log.json; then
            echo "log unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "mupler-bot"
          git config user.email "bot@users.noreply.github.com"
          git add log.json
          git commit -m "log: post $(date -u +%Y-%m-%d)"
          git push
